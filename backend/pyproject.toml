[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "economic-dashboard-backend"
version = "0.1.0"
description = "Local ingestion for the U.S. Economic Intelligence Dashboard"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
economic-dashboard = "economic_dashboard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
